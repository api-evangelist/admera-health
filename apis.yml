aid: admera-health
name: Admera Health
description: >-
  Admera Health is a CLIA-certified and CAP-accredited genomics service provider and contract
  research organization headquartered in South Plainfield, New Jersey, established in 2014 as a
  spinout of GENEWIZ. It runs 100% US-based next-generation sequencing, library preparation and
  bioinformatics operations for academic, biotech and biopharma customers, spanning whole genome
  and whole exome sequencing, metagenomics and amplicon sequencing, bulk and small RNA-seq,
  single-cell sequencing on 10x Genomics, Parse Biosciences and Takara Bio platforms, spatial
  transcriptomics on Visium HD and STOmics Stereo-seq, epigenomics, proteomics and metabolomics,
  plus BioEcho nucleic acid purification products. Customers submit and track projects through
  EraTrack, a login-only web portal. Admera Health publishes no public developer program, API
  reference, SDK or machine-readable specification of any kind.
